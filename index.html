<style>

:root[data-theme="dark"]{--bg:#12161c;--card:#1b2129;--tx:#e8edf3;--mu:#9aa6b4;--pr:#ff8a4c;--pr2:#2a2018;--bd:#2a323c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.6}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1d2b4f 0%,#7a5a8c 45%,#f2a65a 78%,#f7d9a8 100%)}
#login svg.bg{position:absolute;inset:0;width:100%;height:100%}
.box{position:relative;z-index:1;background:rgba(255,255,255,.92);color:#1f2a37;border-radius:20px;padding:28px 24px;width:min(360px,100%);box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center}
.box h1{font-size:1.4rem;margin:.2rem 0}.box p{color:#6b7785;margin:.2rem 0 1rem;font-size:.92rem}
input{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;font-size:1rem;background:#fff;color:#1f2a37}
.btn{border:0;background:var(--pr);color:#fff;padding:11px 18px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:12px}.btn.alt{background:var(--pr2);color:var(--pr)}
#err{color:#c92a2a;font-size:.88rem;min-height:1.3em;margin-top:8px}
#lang{position:fixed;inset:0;z-index:5;background:rgba(10,14,20,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#lang .box{display:grid;gap:10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.brand{padding:12px 16px 4px;font-weight:700}
.tabs{display:flex;gap:6px;padding:6px 12px 10px;overflow-x:auto}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:transparent;color:var(--mu);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.92rem;font-weight:600}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff}
main{max-width:760px;margin:0 auto;padding:16px}
.note{background:var(--pr2);color:var(--pr);padding:9px 13px;border-radius:12px;font-size:.88rem;margin-bottom:12px}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.acc>button{all:unset;box-sizing:border-box;width:100%;padding:14px 16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc>button::after{content:"▾";transition:transform .2s;color:var(--mu)}.acc.open>button::after{transform:rotate(180deg)}
.acc .body{display:none;padding:0 16px 14px}.acc.open .body{display:block}
.it{display:flex;gap:12px;padding:10px 0;border-top:1px dashed var(--bd)}
.it:first-child{border-top:0}.tm{flex:0 0 52px;font-variant-numeric:tabular-nums;color:var(--pr);font-weight:700}
.em{font-size:1.4rem;flex:0 0 auto}.it b{display:block}.it span{color:var(--mu);font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.total{font-size:1.15rem;font-weight:800;color:var(--pr);margin-left:auto}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left}td.n,th.n{text-align:right}
.x{border:0;background:none;color:#c92a2a;cursor:pointer;font-size:1rem}
.sc{overflow-x:auto}
.inf{display:grid;gap:10px}.inf h3{margin:.2rem 0}.chip{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:999px;padding:2px 10px;font-size:.82rem;margin:2px 4px 2px 0}
@media(max-width:480px){.row{grid-template-columns:1fr 1fr}.row .btn{grid-column:1/3}}
</style>
</head>

var S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21],K=[];
for(i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;

for(j=0;j<64;j++){var F,g,r=S[(j>>4)*4+j%4];
if(j<16){F=(B&C)|(~B&D);g=j}else if(j<32){F=(D&B)|(~D&C);g=(5*j+1)%16}else if(j<48){F=B^C^D;g=(3*j+5)%16}else{F=C^(B|~D);g=(7*j)%16}
F=(F+A+K[j]+(w[i+g]|0))|0;A=D;D=C;C=B;B=(B+((F<<r)|(F>>>(32-r))))|0}
a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0}
return[a0,b0,c0,d0].map(function(x){var h='';for(var k=0;k<4;k++)h+=('0'+((x>>>(k*8))&255).toString(16)).slice(-2);return h}).join('')}
